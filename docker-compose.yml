services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # ports bilinçli olarak yok: yalnızca compose ağından erişilir

  backend:
    build: ./backend
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - filedata:/data/storage
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 10

  simulator:
    build: ./simulator
    env_file: .env
    environment:
      API_URL: http://backend:8080
    volumes:
      - filedata:/data/storage
    depends_on:
      backend:
        condition: service_healthy

  verify:
    build: ./verify
    profiles: ["verify"]
    env_file: .env
    environment:
      API_URL: http://backend:8080
      STORAGE_DIR: /data/storage
    volumes:
      - filedata:/data/storage:ro
    depends_on:
      backend:
        condition: service_healthy
      simulator:
        condition: service_started

volumes:
  pgdata:
  filedata: